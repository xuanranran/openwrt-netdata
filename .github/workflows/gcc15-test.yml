name: GCC15 TEST

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/gcc15-test.yml'

permissions:
  contents: read

concurrency:
  group: gcc15-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: x86_64 GCC15 test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout package feed
        uses: actions/checkout@v4
        with:
          path: openwrt-netdata

      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          path: openwrt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl

      - name: Configure x86_64 GCC15 build
        working-directory: openwrt
        run: |
          {
            echo "src-link action ${GITHUB_WORKSPACE}/openwrt-netdata"
            cat feeds.conf.default
          } > feeds.conf

          ./scripts/feeds update -a
          ./scripts/feeds install -p action netdata luci-app-netdata
          ./scripts/feeds install -a

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_DEVEL=y
          CONFIG_TOOLCHAINOPTS=y
          # CONFIG_GCC_USE_VERSION_13 is not set
          # CONFIG_GCC_USE_VERSION_14 is not set
          CONFIG_GCC_USE_VERSION_15=y
          CONFIG_PACKAGE_netdata=y
          CONFIG_PACKAGE_netdata-dashboard-v3=y
          CONFIG_PACKAGE_luci-app-netdata=y
          EOF

          make defconfig

          echo "=== selected toolchain/package config ==="
          grep -E '^(CONFIG_TARGET_x86|CONFIG_DEVEL|CONFIG_TOOLCHAINOPTS|CONFIG_GCC_USE_VERSION|CONFIG_PACKAGE_(netdata|netdata-dashboard-v3|luci-app-netdata))' .config || true
          grep -q '^CONFIG_GCC_USE_VERSION_15=y' .config

      - name: Download package sources
        working-directory: openwrt
        run: make package/feeds/action/netdata/download package/feeds/action/luci-app-netdata/download -j"$(nproc)" V=s

      - name: Build netdata with GCC15
        working-directory: openwrt
        run: make package/feeds/action/netdata/compile package/feeds/action/luci-app-netdata/compile -j"$(nproc)" V=sc

      - name: Show package outputs
        if: always()
        working-directory: openwrt
        run: |
          find bin/packages -type f \( -name '*netdata*.apk' -o -name '*netdata*.ipk' \) -print 2>/dev/null | sort || true
