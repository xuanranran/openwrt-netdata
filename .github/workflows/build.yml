name: Build OpenWrt Package

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'netdata/**'
      - 'luci-app-netdata/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'netdata/**'
      - 'luci-app-netdata/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package ${{ matrix.arch }}-${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_generic

        sdk:
          - "SNAPSHOT"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        uses: openwrt/gh-action-sdk@v9
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          NO_SHFMT_CHECK: true
          PACKAGES: netdata luci-app-netdata
          V: sc

      - name: Show refreshed patch diff (dirty patch debug)
        if: failure()
        run: |
          echo "=== git diff of patches ==="
          git diff netdata/patches/ || true
          echo "=== patch file listing ==="
          ls -la netdata/patches/ || true

      - name: Prepare Artifacts
        run: |
          mkdir -p bin/artifacts

          for pattern in \
            "*netdata*" \
            "protobuf*" \
            "libprotobuf*" \
            "libstdcpp*" \
            "libatomic*" \
            "zlib*" \
            "libuuid*" \
            "libuv*" \
            "libmnl*" \
            "liblz4*" \
            "libjson-c*" \
            "libyaml*" \
            "libopenssl*" \
            "libcurl*" \
            "libzstd*"; do
            find bin/packages/ -type f \( -name "${pattern}.ipk" -o -name "${pattern}.apk" \) -exec cp -n {} bin/artifacts/ \; 2>/dev/null || true
          done

          echo "=== packaged artifacts ==="
          find bin/artifacts -maxdepth 1 -type f -printf "%f\n" | sort

          if [ -z "$(ls -A bin/artifacts)" ]; then
            echo "::error::No packages found."
            find bin/ -type f | sort
            exit 1
          fi

          TAR_NAME="netdata-${{ matrix.arch }}-${{ matrix.sdk }}.tar.gz"
          cd bin/artifacts && tar -czvf "../../$TAR_NAME" * && cd ../..
          mkdir -p upload && mv "$TAR_NAME" upload/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}-${{ matrix.sdk }}
          path: upload/*.tar.gz
          overwrite: true
          retention-days: 3
          if-no-files-found: ignore

      - name: Get Version
        id: version
        run: |
          VERSION=$(grep '^PKG_VERSION:=' netdata/Makefile | cut -d= -f2)
          echo "PKG_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v${{ steps.version.outputs.PKG_VERSION }}"
          name: "v${{ steps.version.outputs.PKG_VERSION }}"
          body: |
            netdata OpenWrt Packages

            Version: ${{ steps.version.outputs.PKG_VERSION }}
          files: upload/*.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
