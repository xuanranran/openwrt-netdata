name: Build OpenWrt Package

on:
  push:
    branches: [main, master, codex/netdata-2.12.2-modular]
    paths:
      - 'netdata/**'
      - 'luci-app-netdata/**'
      - 'scripts/**'
      - 'tests/**'
      - 'install.sh'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'netdata/**'
      - 'luci-app-netdata/**'
      - 'scripts/**'
      - 'tests/**'
      - 'install.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netdata-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate package modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          python3 tests/test_package_selection.py
          python3 tests/test_config_helpers.py
          python3 tests/test_sdk_config.py
          python3 -m pip install --target "$RUNNER_TEMP/kconfig-tests" kconfiglib==14.1.0
          PYTHONPATH="$RUNNER_TEMP/kconfig-tests" python3 tests/test_kconfig.py
          for script in scripts/*.sh install.sh netdata/files/netdata.init netdata/files/netdata.postinst netdata/files/logread.plugin netdata/files/update-go-config netdata/files/render-config; do
            bash -n "$script"
          done

  build:
    name: Package ${{ matrix.arch }}-SNAPSHOT
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: x86_64
            target: x86
            subtarget: '64'
          - arch: aarch64_generic
            target: armsr
            subtarget: armv8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          cache: false
      - name: Install SDK host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext \
            libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip \
            zlib1g-dev file wget curl zstd zip tcl tcl-dev
      - name: Resolve current SDK and checksum
        id: sdk
        run: bash scripts/build-sdk.sh resolve '${{ matrix.target }}' '${{ matrix.subtarget }}' >> "$GITHUB_OUTPUT"
      - name: Restore reference SDK cache
        if: matrix.arch == 'x86_64'
        id: sdk-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/netdata-sdk/x86-64
          key: netdata-sdk-x86-64-shortpath-${{ steps.sdk.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            netdata-sdk-x86-64-shortpath-${{ steps.sdk.outputs.hash }}-
      - name: Compile agent and package modules
        id: compile
        env:
          SDK_FILE: ${{ steps.sdk.outputs.file }}
          SDK_HASH: ${{ steps.sdk.outputs.hash }}
          EXPECTED_PKG_ARCH: ${{ matrix.arch }}
        run: |
          set -o pipefail
          status=0
          bash scripts/build-sdk.sh build '${{ matrix.target }}' '${{ matrix.subtarget }}' 2>&1 | tee sdk-build.log || status=$?
          if [ -f "$RUNNER_TEMP/netdata-sdk/${{ matrix.target }}-${{ matrix.subtarget }}/${SDK_HASH:0:12}/.netdata-sdk-ready" ]; then
            echo 'cacheable=true' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-log-${{ matrix.arch }}
          path: sdk-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Save reference SDK cache (including completed dependencies on failure)
        if: always() && !cancelled() && matrix.arch == 'x86_64' && github.event_name != 'pull_request' && steps.compile.outputs.cacheable == 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/netdata-sdk/x86-64
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Upload packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package-${{ matrix.arch }}-SNAPSHOT
          path: upload/*.tar.gz
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish packages
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: package-*-SNAPSHOT
          merge-multiple: true
          path: upload
      - name: Get version
        id: version
        run: echo "version=$(sed -n 's/^PKG_VERSION:=//p' netdata/Makefile)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: Netdata OpenWrt SNAPSHOT packages with optional collector modules.
          files: upload/*.tar.gz
          fail_on_unmatched_files: true

  cache-cleanup:
    name: Keep newest reference SDK cache
    needs: build
    if: always() && !cancelled() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const caches = (await github.paginate(github.rest.actions.getActionsCacheList, {
              ...context.repo, ref: context.ref, key: 'netdata-sdk-x86-64-', per_page: 100
            })).filter(c => c.ref === context.ref && c.key.startsWith('netdata-sdk-x86-64-'));
            caches.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id);
            for (const cache of caches.slice(1)) {
              await github.rest.actions.deleteActionsCacheById({...context.repo, cache_id: cache.id});
            }
